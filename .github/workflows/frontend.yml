name: frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend.yml'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # Two lockfiles: frontend/package-lock.json (per-app) and the root
          # lockfile, which is what `npm ci` inside a workspace member
          # actually resolves from. Hash both so the cache key tracks the
          # dependencies that are really installed.
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # frontend/ is a workspace member of the root package, so npm ci walks
      # up and installs from the ROOT lockfile (that is also why react resolves
      # to the root-pinned version here). frontend/package-lock.json is kept
      # for standalone installs but is not what CI resolves from.
      - name: Install
        run: npm ci

      # Vitest smoke tests for the API layer (frontend/src/api).
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Report bundle size
        run: |
          echo "### Bundle sizes" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lS dist/assets/*.js | awk '{printf "%8.1f kB  %s\n", $5/1024, $9}' | head -15 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
